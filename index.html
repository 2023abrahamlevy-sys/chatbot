<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Ramón Díaz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Estructura basada en los nombres del boceto -->
    <main class="zona">
        <header class="encabezado">
            <h1>Ramón Díaz</h1>
            <p>Bot de conversación sobre fútbol</p>
        </header>

        <!-- Área donde se despliegan los mensajes -->
        <section class="chat" id="chat">
            <div class="respuestas" id="respuestas">
                <!-- Los mensajes del bot y usuario se agregan dinámicamente -->
            </div>
        </section>

        <!-- Área de interacción del usuario -->
        <footer class="opciones" id="opciones">
            <!-- Los botones de opciones e inputs se cargan dinámicamente -->
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
